worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    map $uri $asset_cache {
        default "no-cache";
        "~^/assets/.+-[A-Za-z0-9_-]{8,}\.(js|css|jpg|png|svg|webp)$" "public, max-age=31536000, immutable";
    }
    # Never cache an error for a missing versioned asset.
    map $status $response_cache {
        default "no-store";
        200 $asset_cache;
        304 $asset_cache;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cache-Control $response_cache always;

        # Check that the document exists, rather than return a constant 200.
        location = /health {
            access_log off;
            try_files /index.html =503;
        }

        location ~ /\. { deny all; }
        location / { try_files $uri $uri/ =404; }
    }
}
