services:
  app:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  test:
    build:
      context: .
      target: testing
    profiles: ["testing"]

  production:
    build:
      context: .
      target: production-selfbuild
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    profiles: ["production"]

volumes:
  node_modules:
